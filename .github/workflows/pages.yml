name: Deploy Pythology Aegis

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aegis-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment carrier
        uses: actions/checkout@v4

      - name: Checkout private Aegis source
        uses: actions/checkout@v4
        with:
          repository: PythologyIntelligence/pythologyaegis
          ref: master
          token: ${{ secrets.AEGIS_SOURCE_TOKEN }}
          path: source
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/web/package-lock.json

      - name: Install web dependencies
        working-directory: source/web
        run: npm ci

      - name: Typecheck
        working-directory: source/web
        run: npm run typecheck

      - name: Build public-safe static site
        working-directory: source/web
        env:
          SITE_ORIGIN: https://aegis.pythology.co.nz
          VITE_AEGIS_API_BASE: https://aegis-api.pythology.co.nz/api/v1
        run: npm run build

      - name: Refuse accidental server-side material
        shell: bash
        run: |
          set -euo pipefail
          test -s source/site/index.html
          test -s source/site/CNAME
          grep -Fxq 'aegis.pythology.co.nz' source/site/CNAME

          if find source/site -type f \( -name '*.env' -o -name '*.pem' -o -name '*.key' -o -name '*.pfx' -o -name '*.sqlite' -o -name '*.db' \) | grep -q .; then
            echo 'Refusing to publish server-side or secret material.' >&2
            exit 1
          fi

          if grep -RIlE 'RESEND_API_KEY|OIDC_CLIENT_SECRET|DATABASE_URL=postgres|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' source/site | grep -q .; then
            echo 'Refusing to publish apparent secret material.' >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
